services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./server.env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./server.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  public:
    build:
      context: ../best5-next
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://server:4000/api
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SITE_URL: https://best5.com.tr
    depends_on:
      - server

  admin:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
      args:
        NODE_OPTIONS: --max-old-space-size=384
    restart: unless-stopped
    depends_on:
      - server

  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      - server
      - public
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  db_data:
  uploads_data:
